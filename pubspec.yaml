name: ganki
description: A Dart/Flutter library for programmatically generating Anki decks (.apkg files). Port of the Python genanki library.
version: 2.0.0
homepage: https://github.com/WandsonDev/ganki

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  archive: ^3.6.1
  sqflite_common_ffi: ^2.3.3
  mustache_template: ^2.0.0
  crypto: ^3.0.3
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0